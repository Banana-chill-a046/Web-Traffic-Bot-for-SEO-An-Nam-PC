<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnnamPC SEO Bot - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 24px;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { font-weight: 300; -webkit-text-fill-color: #6b7280; font-size: 14px; display: block; }
        .status-badge {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge.online { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); }
        .status-badge.offline { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #4ade80; animation: pulse 1.5s infinite; }
        .status-dot.offline { background: #f87171; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .stat-card:hover { border-color: rgba(96, 165, 250, 0.2); transform: translateY(-2px); }
        .stat-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 32px; font-weight: 800; margin-top: 4px; }
        .stat-value.blue { color: #60a5fa; }
        .stat-value.green { color: #4ade80; }
        .stat-value.yellow { color: #fbbf24; }
        .stat-value.purple { color: #a78bfa; }
        .stat-value.pink { color: #f472b6; }
        .stat-change { font-size: 12px; margin-top: 4px; }
        .stat-change.up { color: #4ade80; }
        .stat-change.down { color: #f87171; }

        /* Websites Card */
        .websites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .website-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .website-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 16px 16px 0 0;
        }
        .website-card:nth-child(1)::before { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
        .website-card:nth-child(2)::before { background: linear-gradient(90deg, #4ade80, #22c55e); }
        .website-card:nth-child(3)::before { background: linear-gradient(90deg, #fbbf24, #eab308); }
        .website-card:nth-child(4)::before { background: linear-gradient(90deg, #f472b6, #ec4899); }
        .website-card:hover { border-color: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .website-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .website-name { font-weight: 700; font-size: 16px; }
        .website-url { font-size: 12px; color: #6b7280; font-weight: 400; }
        .website-stats {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .website-count { font-size: 28px; font-weight: 800; }
        .website-status { font-size: 12px; padding: 4px 12px; border-radius: 50px; font-weight: 600; }
        .website-status.running { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .website-status.stopped { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .website-status.waiting { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 20px 24px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            align-items: center;
            justify-content: center;
        }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn:hover { transform: scale(1.03); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; }
        .btn-primary:hover { box-shadow: 0 8px 30px rgba(59, 130, 246, 0.3); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-danger:hover { box-shadow: 0 8px 30px rgba(239, 68, 68, 0.3); }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-success:hover { box-shadow: 0 8px 30px rgba(34, 197, 94, 0.3); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .btn-warning:hover { box-shadow: 0 8px 30px rgba(245, 158, 11, 0.3); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #9ca3af; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* Log */
        .log-container {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .log-header h3 { font-size: 14px; font-weight: 600; color: #9ca3af; }
        .log-header button {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .log-header button:hover { color: #9ca3af; }
        .log-body {
            padding: 16px 24px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
        }
        .log-body::-webkit-scrollbar { width: 4px; }
        .log-body::-webkit-scrollbar-track { background: transparent; }
        .log-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-time { color: #4b5563; margin-right: 12px; }
        .log-msg { color: #d1d5db; }
        .log-msg.green { color: #4ade80; }
        .log-msg.red { color: #f87171; }
        .log-msg.yellow { color: #fbbf24; }
        .log-msg.blue { color: #60a5fa; }
        .log-msg.purple { color: #a78bfa; }
        .log-msg.gray { color: #6b7280; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; text-align: center; }
            .controls { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .websites-grid { grid-template-columns: 1fr; }
            .stat-value { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="dashboard">

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <h1>🚀 AnnamPC SEO</h1>
            <span>Traffic Bot Dashboard v2.0</span>
        </div>
        <div id="statusBadge" class="status-badge offline">
            <span class="status-dot offline"></span>
            <span id="statusText">Đã dừng</span>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Tổng lượt truy cập</div>
            <div class="stat-value blue" id="totalVisits">0</div>
            <div class="stat-change up">↑ +0 hôm nay</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Thành công</div>
            <div class="stat-value green" id="successVisits">0</div>
            <div class="stat-change up">↑ 100% tỷ lệ</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Hôm nay</div>
            <div class="stat-value yellow" id="todayVisits">0</div>
            <div class="stat-change up">↑ Tăng hôm nay</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Thời gian chạy</div>
            <div class="stat-value purple" id="runTime">00:00:00</div>
            <div class="stat-change" style="color:#6b7280;">⏱️ Đã dừng</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Mục tiêu 90K</div>
            <div class="stat-value pink" id="goalProgress">0%</div>
            <div class="stat-change up" id="goalRemain">Còn 90,000</div>
        </div>
    </div>

    <!-- Websites -->
    <div class="websites-grid" id="websitesGrid"></div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-primary" id="btnToggle" onclick="toggleBot()">▶️ BẬT BOT 24/7</button>
        <button class="btn btn-warning" id="btnMassive" onclick="runMassive()">⚡ +90K LƯỢT</button>
        <button class="btn btn-outline" onclick="resetCounts()">🔄 RESET</button>
        <button class="btn btn-outline" onclick="clearLog()">🗑️ Xóa log</button>
    </div>

    <!-- Log -->
    <div class="log-container">
        <div class="log-header">
            <h3>📋 Log thời gian thực</h3>
            <span style="font-size:12px;color:#4b5563;" id="logCount">0 entries</span>
        </div>
        <div class="log-body" id="logBody"></div>
    </div>

</div>

<script>
    // ============== DATA ==============
    const STORAGE_KEY = 'annampc_seo_bot';
    const websites = [
        { id: 1, name: 'AnnamPC', url: 'https://www.annampc.io.vn', color: '#60a5fa' },
        { id: 2, name: 'NamMC', url: 'https://nammc.nammc.click', color: '#4ade80' },
        { id: 3, name: 'TestPC', url: 'https://testpc.annampc.io.vn', color: '#fbbf24' },
        { id: 4, name: 'HoangHaoPC', url: 'https://www.hoanghaopc.com', color: '#f472b6' }
    ];

    let data = loadData();
    let botRunning = false;
    let botInterval = null;
    let timerInterval = null;
    let seconds = 0;
    let logCount = 0;

    function loadData() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.counts) return parsed;
            }
        } catch (e) {}
        return {
            counts: { 1: 0, 2: 0, 3: 0, 4: 0 },
            total: 0,
            success: 0,
            today: 0,
            lastDate: new Date().toDateString()
        };
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        updateUI();
    }

    // ============== RENDER ==============
    function renderWebsites() {
        const grid = document.getElementById('websitesGrid');
        grid.innerHTML = websites.map(w => `
            <div class="website-card">
                <div class="website-header">
                    <span class="website-name" style="color:${w.color}">${w.name}</span>
                    <span class="website-url">${w.url.replace('https://', '')}</span>
                </div>
                <div class="website-stats">
                    <span class="website-count" style="color:${w.color}" id="count${w.id}">${data.counts[w.id] || 0}</span>
                    <span class="website-status stopped" id="status${w.id}">● Đã dừng</span>
                </div>
            </div>
        `).join('');
    }

    function updateUI() {
        websites.forEach(w => {
            const el = document.getElementById(`count${w.id}`);
            if (el) el.textContent = data.counts[w.id] || 0;
        });

        document.getElementById('totalVisits').textContent = data.total || 0;
        document.getElementById('successVisits').textContent = data.success || 0;
        
        const today = new Date().toDateString();
        if (data.lastDate !== today) {
            data.today = 0;
            data.lastDate = today;
            saveData();
        }
        document.getElementById('todayVisits').textContent = data.today || 0;

        const goal = 90000;
        const progress = Math.min((data.total / goal) * 100, 100);
        document.getElementById('goalProgress').textContent = progress.toFixed(1) + '%';
        const remain = Math.max(goal - data.total, 0);
        document.getElementById('goalRemain').textContent = `Còn ${remain.toLocaleString()}`;
    }

    function updateStatus(id, text, type = 'stopped') {
        const el = document.getElementById(`status${id}`);
        if (!el) return;
        el.textContent = text;
        el.className = `website-status ${type}`;
    }

    function updateGlobalStatus(status) {
        const badge = document.getElementById('statusBadge');
        const dot = badge.querySelector('.status-dot');
        const text = document.getElementById('statusText');
        if (status === 'online') {
            badge.className = 'status-badge online';
            dot.className = 'status-dot online';
            text.textContent = 'Đang chạy';
        } else {
            badge.className = 'status-badge offline';
            dot.className = 'status-dot offline';
            text.textContent = 'Đã dừng';
        }
    }

    // ============== LOG ==============
    const logBody = document.getElementById('logBody');

    function addLog(message, type = 'gray') {
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = `<span class="log-time">[${time}]</span><span class="log-msg ${type}">${message}</span>`;
        logBody.appendChild(div);
        logBody.scrollTop = logBody.scrollHeight;
        logCount++;
        document.getElementById('logCount').textContent = logCount + ' entries';
        if (logBody.children.length > 200) {
            logBody.removeChild(logBody.children[0]);
        }
    }

    function clearLog() {
        logBody.innerHTML = '';
        logCount = 0;
        document.getElementById('logCount').textContent = '0 entries';
        addLog('🗑️ Log đã được xóa', 'gray');
    }

    // ============== BOT ==============
    async function visitWebsite(id, name, url) {
        try {
            const res = await fetch(`/api/fetch?url=${encodeURIComponent(url)}`);
            const result = await res.json();
            
            if (result.success) {
                data.counts[id] = (data.counts[id] || 0) + 1;
                data.total = (data.total || 0) + 1;
                data.success = (data.success || 0) + 1;
                data.today = (data.today || 0) + 1;
                saveData();
                updateUI();
                addLog(`✅ ${name} +1 (tổng: ${data.counts[id]})`, 'green');
                updateStatus(id, `✅ ${data.counts[id]} lượt`, 'running');
                return true;
            } else {
                addLog(`❌ ${name} - ${result.error || 'Lỗi'}`, 'red');
                updateStatus(id, '⚠️ Lỗi', 'stopped');
                return false;
            }
        } catch (e) {
            addLog(`❌ ${name} - ${e.message}`, 'red');
            updateStatus(id, '⚠️ Lỗi', 'stopped');
            return false;
        }
    }

    async function runCycle() {
        if (!botRunning) return;
        
        addLog('🔄 Bắt đầu chu kỳ...', 'blue');
        
        for (const w of websites) {
            if (!botRunning) break;
            await visitWebsite(w.id, w.name, w.url);
            await new Promise(r => setTimeout(r, 1500));
        }
        
        addLog(`📊 Tổng: ${data.total} lượt`, 'purple');
        
        if (botRunning) {
            botInterval = setTimeout(runCycle, 25000);
        }
    }

    function toggleBot() {
        const btn = document.getElementById('btnToggle');
        
        if (botRunning) {
            botRunning = false;
            clearTimeout(botInterval);
            clearInterval(timerInterval);
            btn.innerHTML = '▶️ BẬT BOT 24/7';
            btn.className = 'btn btn-primary';
            updateGlobalStatus('offline');
            websites.forEach(w => updateStatus(w.id, '● Đã dừng', 'stopped'));
            addLog('⏹️ ĐÃ TẮT BOT!', 'yellow');
            document.querySelector('.stat-change').textContent = '⏱️ Đã dừng';
        } else {
            botRunning = true;
            btn.innerHTML = '⏹️ TẮT BOT 24/7';
            btn.className = 'btn btn-danger';
            updateGlobalStatus('online');
            websites.forEach(w => updateStatus(w.id, '⏳ Đang chạy...', 'running'));
            addLog('🔥 BẬT BOT 24/7!', 'green');
            
            seconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                document.getElementById('runTime').textContent = `${h}:${m}:${s}`;
            }, 1000);
            
            runCycle();
        }
    }

    // ============== MASSIVE 90K - TĂNG ẢO TRỰC TIẾP ==============
    function runMassive() {
        if (botRunning) {
            addLog('⚠️ Tắt bot 24/7 trước khi tăng 90K!', 'yellow');
            return;
        }

        const btn = document.getElementById('btnMassive');
        btn.textContent = '⏳ ĐANG TĂNG...';
        btn.disabled = true;

        addLog('⚡ BẮT ĐẦU TĂNG 90,000 LƯỢT!', 'yellow');

        const perSite = 22500;

        websites.forEach((w) => {
            data.counts[w.id] = (data.counts[w.id] || 0) + perSite;
        });
        data.total = (data.total || 0) + 90000;
        data.success = (data.success || 0) + 90000;
        data.today = (data.today || 0) + 90000;
        saveData();
        updateUI();

        addLog(`✅ AnnamPC: +${perSite.toLocaleString()} (tổng: ${data.counts[1].toLocaleString()})`, 'green');
        addLog(`✅ NamMC: +${perSite.toLocaleString()} (tổng: ${data.counts[2].toLocaleString()})`, 'green');
        addLog(`✅ TestPC: +${perSite.toLocaleString()} (tổng: ${data.counts[3].toLocaleString()})`, 'green');
        addLog(`✅ HoangHaoPC: +${perSite.toLocaleString()} (tổng: ${data.counts[4].toLocaleString()})`, 'green');
        addLog(`🎉 TỔNG CỘNG: +90,000 LƯỢT TRUY CẬP!`, 'purple');

        const progress = Math.min((data.total / 90000) * 100, 100);
        document.getElementById('goalProgress').textContent = progress.toFixed(1) + '%';
        const remain = Math.max(90000 - data.total, 0);
        document.getElementById('goalRemain').textContent = `Còn ${remain.toLocaleString()}`;

        btn.textContent = '⚡ +90K LƯỢT';
        btn.disabled = false;
    }

    // ============== RESET ==============
    function resetCounts() {
        if (botRunning) {
            addLog('⚠️ Tắt bot trước khi reset!', 'yellow');
            return;
        }
        if (confirm('Reset toàn bộ dữ liệu?')) {
            data = {
                counts: { 1: 0, 2: 0, 3: 0, 4: 0 },
                total: 0,
                success: 0,
                today: 0,
                lastDate: new Date().toDateString()
            };
            saveData();
            updateUI();
            addLog('🔄 Đã reset dữ liệu!', 'yellow');
            document.getElementById('runTime').textContent = '00:00:00';
            websites.forEach(w => updateStatus(w.id, '● Đã dừng', 'stopped'));
        }
    }

    // ============== INIT ==============
    renderWebsites();
    updateUI();
    updateGlobalStatus('offline');
    addLog('🚀 SEO Bot Dashboard đã sẵn sàng!', 'green');
    addLog('📊 Dữ liệu được lưu trên trình duyệt', 'gray');
    addLog('💡 Bấm "BẬT BOT 24/7" để bắt đầu', 'blue');
    addLog('⚡ Bấm "+90K LƯỢT" để tăng nhanh', 'yellow');
</script>

</body>
</html>
