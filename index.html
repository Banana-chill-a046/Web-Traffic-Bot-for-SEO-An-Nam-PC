<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnnamPC SEO Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 min-h-screen text-white">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🚀</div>
            <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                AnnamPC SEO Bot
            </h1>
            <p class="text-gray-400 mt-2">🌍 Tăng traffic cho 4 website</p>
            
            <div class="flex justify-center gap-2 flex-wrap mt-4">
                <span class="px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-sm border border-green-500/30">✅ Hoạt động</span>
                <span class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-sm border border-blue-500/30">🌐 4 Website</span>
                <span class="px-3 py-1 bg-purple-500/20 text-purple-400 rounded-full text-sm border border-purple-500/30">⚡ 90k visits</span>
            </div>
        </div>

        <!-- 4 Website -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10 hover:border-blue-500/50 transition">
                <div class="text-2xl">🖥️</div>
                <div class="text-sm font-semibold text-blue-400">AnnamPC</div>
                <div class="text-xs text-gray-500">www.annampc.io.vn</div>
            </div>
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10 hover:border-green-500/50 transition">
                <div class="text-2xl">🌐</div>
                <div class="text-sm font-semibold text-green-400">NamMC</div>
                <div class="text-xs text-gray-500">nammc.nammc.click</div>
            </div>
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10 hover:border-yellow-500/50 transition">
                <div class="text-2xl">🧪</div>
                <div class="text-sm font-semibold text-yellow-400">TestPC</div>
                <div class="text-xs text-gray-500">testpc.annampc.io.vn</div>
            </div>
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10 hover:border-pink-500/50 transition">
                <div class="text-2xl">🏠</div>
                <div class="text-sm font-semibold text-pink-400">HoangHao</div>
                <div class="text-xs text-gray-500">www.hoanghaopc.com</div>
            </div>
        </div>

        <!-- Nút -->
        <div class="text-center mb-8">
            <button onclick="runBot()" id="btnRun" 
                    class="px-12 py-4 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl text-xl font-bold hover:scale-105 transition shadow-lg shadow-purple-500/30">
                🚀 CHẠY BOT
            </button>
            <button onclick="runMassive()" id="btnMassive" 
                    class="ml-4 px-8 py-4 bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl text-xl font-bold hover:scale-105 transition shadow-lg shadow-red-500/30">
                ⚡ 90K
            </button>
        </div>

        <!-- Thống kê -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10">
                <div class="text-2xl font-bold text-blue-400" id="totalVisits">0</div>
                <div class="text-xs text-gray-400">Tổng visits</div>
            </div>
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10">
                <div class="text-2xl font-bold text-green-400" id="successVisits">0</div>
                <div class="text-xs text-gray-400">Thành công</div>
            </div>
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10">
                <div class="text-2xl font-bold text-yellow-400" id="progressPercent">0%</div>
                <div class="text-xs text-gray-400">Tiến độ</div>
            </div>
            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-4 text-center border border-white/10">
                <div class="text-2xl font-bold text-purple-400" id="countryCount">4</div>
                <div class="text-xs text-gray-400">Website</div>
            </div>
        </div>

        <!-- Log -->
        <div class="bg-black/50 backdrop-blur-lg rounded-xl p-6 border border-white/10">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-semibold text-gray-300">📋 Log</h3>
                <button onclick="clearLog()" class="text-xs text-gray-500 hover:text-gray-300">Xóa log</button>
            </div>
            <div id="logBox" class="bg-black/50 rounded-lg p-4 h-64 overflow-y-auto font-mono text-sm"></div>
        </div>

    </div>

    <script>
        const logBox = document.getElementById('logBox');

        // 4 WEBSITE CHÍNH XÁC
        const websites = [
            { name: 'AnnamPC', url: 'https://www.annampc.io.vn' },
            { name: 'NamMC', url: 'https://nammc.nammc.click' },
            { name: 'TestPC', url: 'https://testpc.annampc.io.vn' },
            { name: 'HoangHaoPC', url: 'https://www.hoanghaopc.com' }
        ];

        function addLog(message, color = '#4ade80') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'py-0.5';
            div.innerHTML = `<span style="color: #6b7280;">[${time}]</span> <span style="color: ${color};">${message}</span>`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            logBox.innerHTML = '';
            addLog('🗑️ Đã xóa log', '#6b7280');
        }

        function updateStats(total, success) {
            document.getElementById('totalVisits').textContent = total || 0;
            document.getElementById('successVisits').textContent = success || 0;
            const percent = total > 0 ? Math.round((success / total) * 100) : 0;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('countryCount').textContent = websites.length;
        }

        async function runBot() {
            const btn = document.getElementById('btnRun');
            btn.innerHTML = '⏳ ĐANG CHẠY...';
            btn.disabled = true;
            btn.className = 'px-12 py-4 bg-gray-600 rounded-2xl text-xl font-bold';

            addLog('🚀 Bắt đầu truy cập 4 website...', '#fbbf24');
            addLog('📋 Danh sách:', '#60a5fa');
            websites.forEach(w => addLog(`  - ${w.name}: ${w.url}`, '#60a5fa'));

            let success = 0;
            let failed = 0;

            for (let i = 0; i < websites.length; i++) {
                const w = websites[i];
                try {
                    addLog(`  📌 Đang truy cập: ${w.name}`, '#fbbf24');
                    const res = await fetch(w.url);
                    if (res.ok) {
                        addLog(`  ✅ ${w.name} - Status: ${res.status} ✅`, '#4ade80');
                        success++;
                    } else {
                        addLog(`  ❌ ${w.name} - Status: ${res.status}`, '#f87171');
                        failed++;
                    }
                } catch (e) {
                    addLog(`  ❌ ${w.name} - Lỗi: ${e.message}`, '#f87171');
                    failed++;
                }
                await new Promise(r => setTimeout(r, 1500));
            }

            updateStats(success + failed, success);
            addLog(`✅ Hoàn thành: ${success} thành công, ${failed} thất bại`, success === websites.length ? '#4ade80' : '#fbbf24');

            btn.innerHTML = '🚀 CHẠY BOT';
            btn.disabled = false;
            btn.className = 'px-12 py-4 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl text-xl font-bold hover:scale-105 transition shadow-lg shadow-purple-500/30';
        }

        async function runMassive() {
            const btn = document.getElementById('btnMassive');
            btn.innerHTML = '⏳ ĐANG CHẠY...';
            btn.disabled = true;
            btn.className = 'ml-4 px-8 py-4 bg-gray-600 rounded-2xl text-xl font-bold';

            addLog('⚡ BẮT ĐẦU TĂNG TỐC 90K VISITS!', '#f472b6');
            addLog('🔄 Đang gọi API tăng tốc...', '#fbbf24');

            try {
                const res = await fetch('/api/bot');
                const data = await res.json();
                addLog(`✅ ${data.message}`, '#4ade80');
                if (data.websites) {
                    data.websites.forEach((url, i) => {
                        addLog(`  ${i+1}. ${url}`, '#60a5fa');
                    });
                }
            } catch (e) {
                addLog(`❌ Lỗi: ${e.message}`, '#f87171');
                addLog('🔄 Chuyển sang chạy bot thường...', '#fbbf24');
                await runBot();
            }

            btn.innerHTML = '⚡ 90K';
            btn.disabled = false;
            btn.className = 'ml-4 px-8 py-4 bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl text-xl font-bold hover:scale-105 transition shadow-lg shadow-red-500/30';
        }

        // Khởi tạo
        addLog('✅ Bot đã sẵn sàng!', '#4ade80');
        addLog('📋 4 Website:', '#60a5fa');
        websites.forEach(w => addLog(`  - ${w.name}: ${w.url}`, '#60a5fa'));
        addLog('💡 Nhấn "CHẠY BOT" để bắt đầu', '#fbbf24');
        addLog('💡 Nhấn "90K" để tăng tốc', '#f472b6');
    </script>

</body>
</html>
